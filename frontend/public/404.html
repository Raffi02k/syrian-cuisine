<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Sidan hittades inte | Syrian Cuisine</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #120c08;
        color: #fdfaf6;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(212, 175, 55, 0.2);
        border-radius: 16px;
        padding: 40px 32px;
      }
      h1 {
        font-size: 72px;
        margin: 0 0 16px 0;
        color: #e5c07b;
      }
      p {
        color: #c4b5a5;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      a {
        display: inline-block;
        background: #d4af37;
        color: #120c08;
        font-weight: 600;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 9999px;
        transition: transform 0.2s, background 0.2s;
      }
      a:hover {
        background: #e5c07b;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <h2>Sidan hittades inte</h2>
      <p>Den efterfrågade sidan existerar tyvärr inte eller har flyttats.</p>
      <a href="/">Tillbaka till Startsidan</a>
    </div>
  </body>
</html>
